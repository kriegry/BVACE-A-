<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BVACE AI - Collective Brain</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0b0f19; color: #e2e8f0; display: flex; height: 100vh; overflow: hidden; }

        /* Sol Sidebar */
        #sidebar { width: 300px; background: #111827; border-right: 1px solid #1f2937; display: flex; flex-direction: column; padding: 20px; gap: 15px; }
        .logo-area { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
        .logo-icon { width: 40px; height: 40px; border: 2px solid #6366f1; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #6366f1; font-weight: bold; box-shadow: 0 0 10px rgba(99,102,241,0.3); }
        .logo-text h1 { font-size: 1.1rem; color: white; letter-spacing: 1px; }
        .logo-text p { font-size: 0.7rem; color: #9ca3af; }

        .section-title { font-size: 0.75rem; text-transform: uppercase; color: #9ca3af; font-weight: bold; margin-top: 5px; letter-spacing: 0.5px; }
        
        .teach-box { display: flex; flex-direction: column; gap: 8px; background: #1f2937; padding: 12px; border-radius: 10px; border: 1px solid #374151; }
        .teach-box input { padding: 10px; background: #111827; border: 1px solid #4b5563; color: white; border-radius: 6px; outline: none; font-size: 0.85rem; }
        .teach-box input:focus { border-color: #6366f1; }
        .teach-btn { padding: 10px; background: linear-gradient(135deg, #7c3aed, #4f46e5); color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .teach-btn:hover { opacity: 0.9; }

        .status-badge { display: flex; align-items: center; justify-content: space-between; background: #1f2937; padding: 10px; border-radius: 8px; font-size: 0.8rem; border: 1px solid #374151; }
        .status-dot { width: 8px; height: 8px; background: #10b981; border-radius: 50%; box-shadow: 0 0 8px #10b981; }

        .report-btn { background: rgba(239, 68, 68, 0.15); border: 1px solid #ef4444; color: #f87171; padding: 10px; border-radius: 8px; font-weight: bold; cursor: pointer; text-align: center; font-size: 0.85rem; }
        .admin-link { margin-top: auto; text-align: center; font-size: 0.75rem; color: #9ca3af; cursor: pointer; }
        .admin-link:hover { color: white; }

        /* Sağ Chat Alanı */
        #main-chat { flex: 1; display: flex; flex-direction: column; background: #0b0f19; }
        #chat-container { flex: 1; overflow-y: auto; padding: 25px; display: flex; flex-direction: column; gap: 15px; }
        
        .message { padding: 14px 18px; border-radius: 12px; max-width: 75%; word-wrap: break-word; font-size: 0.95rem; line-height: 1.4; }
        .user { background: #4f46e5; color: white; align-self: flex-end; border-bottom-right-radius: 2px; }
        .bot { background: #161e2e; color: #e2e8f0; align-self: flex-start; border: 1px solid #1f2937; border-bottom-left-radius: 2px; }

        /* Alt Mesaj Yazma Alanı */
        #input-container { display: flex; padding: 20px; background: #111827; border-top: 1px solid #1f2937; gap: 12px; }
        #user-input { flex: 1; padding: 14px 18px; background: #0b0f19; border: 1px solid #374151; color: white; border-radius: 10px; outline: none; font-size: 0.95rem; }
        #user-input:focus { border-color: #6366f1; }
        .send-btn { padding: 0 25px; background: #7c3aed; color: white; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; }
        .send-btn:hover { background: #6d28d9; }
    </style>
</head>
<body>

    <!-- Sol Kontrol Paneli -->
    <div id="sidebar">
        <div class="logo-area">
            <div class="logo-icon">B</div>
            <div class="logo-text">
                <h1>BVACE</h1>
                <p>COLLECTIVE BRAIN</p>
            </div>
        </div>

        <div class="section-title">Bvace'ye Laf Öğret</div>
        <div class="teach-box">
            <input type="text" id="teach-q" placeholder="Kullanıcı der ki...">
            <input type="text" id="teach-a" placeholder="Bvace desin ki...">
            <button class="teach-btn" onclick="teachCloud()">Ortak Havuza Öğret</button>
        </div>

        <div class="status-badge">
            <span id="memory-count">Ortak Ağ: Yükleniyor...</span>
            <div class="status-dot"></div>
        </div>

        <div class="report-btn" onclick="openReport()">
            🚨 Rapor Paneli (<span id="report-count">1</span>)
        </div>

        <div class="admin-link" onclick="adminLogin()">
            🔒 Çıkış Yap (Admin)
        </div>
    </div>

    <!-- Sağ Sohbet Alanı -->
    <div id="main-chat">
        <div id="chat-container">
            <div class="message bot">Ben Bvace. Herkesin bana öğretebileceği bir sohbet botuyum, kokokae tarafından geliştirildim. Bana bir şey sor veya sol panelden yeni laf öğret.</div>
        </div>

        <div id="input-container">
            <input type="text" id="user-input" placeholder="Bvace ile konuş..." onkeypress="handleKey(event)">
            <button class="send-btn" onclick="sendMessage()">Gönder</button>
        </div>
    </div>

    <!-- Firebase SDK (Modular v10) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDPoguXj6pEv_N5pDmLW05cyM_7HZB3_k",
            authDomain: "bvace-cloud.firebaseapp.com",
            projectId: "bvace-cloud",
            storageBucket: "bvace-cloud.firebasestorage.app",
            messagingSenderId: "751232690894",
            appId: "1:751232690894:web:2b105e3ac640eecef33e9f",
            measurementId: "G-L8VTFR2QKX"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        window.bvaceDB = db;
        window.bvaceFirestore = { collection, addDoc, getDocs };
        
        loadCloudMemory();
    </script>

    <script>
        let cloudMemory = [];

        async function loadCloudMemory() {
            try {
                if (!window.bvaceDB) {
                    setTimeout(loadCloudMemory, 500);
                    return;
                }
                const querySnapshot = await window.bvaceFirestore.getDocs(window.bvaceFirestore.collection(window.bvaceDB, "memory"));
                cloudMemory = [];
                querySnapshot.forEach((doc) => {
                    cloudMemory.push(doc.data());
                });
                document.getElementById("memory-count").innerText = `Ortak Ağ: ${cloudMemory.length} Laf`;
            } catch (e) {
                document.getElementById("memory-count").innerText = "Ortak Ağ: Hata!";
            }
        }

        async function teachCloud() {
            const qInput = document.getElementById("teach-q");
            const aInput = document.getElementById("teach-a");
            const q = qInput.value.trim().toLowerCase();
            const a = aInput.value.trim();

            if (!q || !a) {
                alert("Lütfen iki alanı da doldur kanka!");
                return;
            }

            try {
                await window.bvaceFirestore.addDoc(window.bvaceFirestore.collection(window.bvaceDB, "memory"), { soru: q, cevap: a });
                cloudMemory.push({ soru: q, cevap: a });
                document.getElementById("memory-count").innerText = `Ortak Ağ: ${cloudMemory.length} Laf`;
                
                appendMessage(`Öğretilen: ${q} | ${a}`, "user");
                appendMessage("Eyvallah kanka, bunu ortak bulut havuzuna çaktım! Artık herkes bilecek.", "bot");
                
                qInput.value = "";
                aInput.value = "";
            } catch (e) {
                alert("Buluta kaydederken hata oluştu kanka!");
            }
        }

        async function sendMessage() {
            const inputField = document.getElementById("user-input");
            const text = inputField.value.trim();
            if (!text) return;

            appendMessage(text, "user");
            inputField.value = "";

            const cleanText = text.toLowerCase();
            let found = cloudMemory.find(item => cleanText.includes(item.soru));

            setTimeout(() => {
                if (found) {
                    appendMessage(found.cevap, "bot");
                } else {
                    appendMessage("Kanka bunu henüz bilmiyorum, sol taraftan öğretebilirsin.", "bot");
                }
            }, 300);
        }

        function appendMessage(text, sender) {
            const container = document.getElementById("chat-container");
            const msgDiv = document.createElement("div");
            msgDiv.className = `message ${sender}`;
            msgDiv.innerText = text;
            container.appendChild(msgDiv);
            container.scrollTop = container.scrollHeight;
        }

        function handleKey(event) {
            if (event.key === "Enter") {
                sendMessage();
            }
        }

        function openReport() {
            const pass = prompt("Admin Şifresi:");
            if (pass === "bvaceAndKOKOKAE123") {
                alert("Rapor paneli boş, her şey temiz kanka!");
            } else if (pass !== null) {
                alert("Hatalı şifre!");
            }
        }

        function adminLogin() {
            const pass = prompt("Admin Şifresi Gir:");
            if (pass === "bvaceAndKOKOKAE123") {
                alert("Admin yetkisi doğrulandı!");
            } else if (pass !== null) {
                alert("Hatalı şifre!");
            }
        }
    </script>
</body>
</html>
