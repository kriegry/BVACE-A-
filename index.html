<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BVACE AI Core - Cloud Edition</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: monospace; }
        body { background-color: #0f172a; color: #38bdf8; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        header { background: #1e293b; padding: 15px; text-align: center; border-bottom: 2px solid #334155; font-size: 1.2rem; font-weight: bold; }
        #chat-container { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 10px; }
        .message { padding: 10px 15px; border-radius: 8px; max-width: 80%; word-wrap: break-word; }
        .user { background: #334155; color: #f8fafc; align-self: flex-end; }
        .bot { background: #1e293b; color: #38bdf8; align-self: flex-start; border: 1px solid #334155; }
        #input-container { display: flex; padding: 15px; background: #1e293b; border-top: 2px solid #334155; gap: 10px; }
        input { flex: 1; padding: 12px; background: #0f172a; border: 1px solid #475569; color: #f8fafc; border-radius: 6px; outline: none; font-size: 1rem; }
        button { padding: 12px 20px; background: #0284c7; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; }
        button:hover { background: #0369a1; }
        #admin-panel { padding: 10px; background: #0f172a; border-top: 1px solid #334155; display: none; text-align: center; }
        #report-btn { position: fixed; top: 10px; right: 10px; background: #ef4444; font-size: 0.8rem; padding: 5px 10px; }
    </style>
</head>
<body>

    <header>BVACE - Cloud Collective Brain</header>
    <button id="report-btn" onclick="openAdmin()">Admin</button>

    <div id="chat-container">
        <div class="message bot">Selam kanka! Ben BVACE. Artık bulut tabanlı ortak beyinle çalışıyorum. Bana bir şeyler öğretebilir ya da soru sorabilirsin!</div>
    </div>

    <div id="admin-panel">
        <input type="password" id="admin-pass" placeholder="Admin Şifresi...">
        <button onclick="checkAdmin()">Giriş</button>
    </div>

    <div id="input-container">
        <input type="text" id="user-input" placeholder="Mesajını yaz veya 'Soru | Cevap' formatında öğret..." onkeypress="handleKey(event)">
        <button onclick="sendMessage()">Gönder</button>
    </div>

    <!-- Firebase SDK (Modular v10) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // Senin Firebase Bağlantı Ayarların
        const firebaseConfig = {
            apiKey: "AIzaSyDPoguXj6pEv_N5pDmLW05cyM_7HZB3_k",
            authDomain: "bvace-cloud.firebaseapp.com",
            projectId: "bvace-cloud",
            storageBucket: "bvace-cloud.firebasestorage.app",
            messagingSenderId: "751232690894",
            appId: "1:751232690894:web:2b105e3ac640eecef33e9f",
            measurementId: "G-L8VTFR2QKX"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Global fonksiyonlar için window'a atıyoruz
        window.bvaceDB = db;
        window.bvaceFirestore = { collection, addDoc, getDocs };
        
        // İlk açılışta buluttan hafızayı çek
        loadCloudMemory();
    </script>

    <script>
        // Bellek havuzu
        let cloudMemory = [];

        async function loadCloudMemory() {
            try {
                if (!window.bvaceDB) {
                    setTimeout(loadCloudMemory, 500);
                    return;
                }
                const querySnapshot = await window.bvaceFirestore.getDocs(window.bvaceFirestore.collection(window.bvaceDB, "memory"));
                cloudMemory = [];
                querySnapshot.forEach((doc) => {
                    cloudMemory.push(doc.data());
                });
            } catch (e) {
                console.log("Buluttan veri çekerken hata:", e);
            }
        }

        async function sendMessage() {
            const inputField = document.getElementById("user-input");
            const text = inputField.value.trim();
            if (!text) return;

            appendMessage(text, "user");
            inputField.value = "";

            // Öğretme formatı: "Soru | Cevap"
            if (text.includes("|")) {
                const parts = text.split("|");
                const q = parts[0].trim().toLowerCase();
                const a = parts[1].trim();

                try {
                    await window.bvaceFirestore.addDoc(window.bvaceFirestore.collection(window.bvaceDB, "memory"), { soru: q, cevap: a });
                    cloudMemory.push({ soru: q, cevap: a });
                    appendMessage("Eyvallah kanka, bunu buluta kaydettim artık herkes bilecek!", "bot");
                } catch (e) {
                    appendMessage("Kanka buluta kaydederken hata oluştu!", "bot");
                }
                return;
            }

            // Normal soru sorma
            const cleanText = text.toLowerCase();
            let found = cloudMemory.find(item => cleanText.includes(item.soru));

            setTimeout(() => {
                if (found) {
                    appendMessage(found.cevap, "bot");
                } else {
                    appendMessage("Kanka bunu henüz bilmiyorum. Öğretmek için 'Soru | Cevap' yazabilirsin.", "bot");
                }
            }, 300);
        }

        function appendMessage(text, sender) {
            const container = document.getElementById("chat-container");
            const msgDiv = document.createElement("div");
            msgDiv.className = `message ${sender}`;
            msgDiv.innerText = text;
            container.appendChild(msgDiv);
            container.scrollTop = container.scrollHeight;
        }

        function handleKey(event) {
            if (event.key === "Enter") {
                sendMessage();
            }
        }

        function openAdmin() {
            const pass = prompt("Admin Şifresini Gir:");
            if (pass === "bvaceAndKOKOKAE123") {
                alert("Admin paneli aktif! (Geliştirme aşamasında)");
            } else if (pass !== null) {
                alert("Hatalı şifre!");
            }
        }
    </script>
</body>
</html>
