<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BVACE AI - Cloud Collective Brain</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: linear-gradient(135deg, #0f172a, #1e1b4b); color: #f8fafc; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        
        /* Header */
        header { background: rgba(15, 23, 42, 0.8); backdrop-filter: blur(10px); padding: 15px 20px; text-align: center; border-bottom: 1px solid rgba(255,255,255,0.1); font-size: 1.3rem; font-weight: bold; letter-spacing: 1px; color: #a855f7; display: flex; justify-content: space-between; align-items: center; }
        header span { font-size: 0.8rem; background: #3b82f6; padding: 3px 8px; border-radius: 12px; color: white; }

        /* Chat Area */
        #chat-container { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 15px; scroll-behavior: smooth; }
        
        .message { padding: 12px 18px; border-radius: 15px; max-width: 75%; word-wrap: break-word; font-size: 0.95rem; line-height: 1.4; animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        .user { background: #3b82f6; color: white; align-self: flex-end; border-bottom-right-radius: 2px; box-shadow: 0 4px 15px rgba(59, 130, 246, 0.3); }
        .bot { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(5px); border: 1px solid rgba(255,255,255,0.08); color: #e2e8f0; align-self: flex-start; border-bottom-left-radius: 2px; box-shadow: 0 4px 15px rgba(0,0,0,0.2); }

        /* Input Area */
        #input-container { display: flex; padding: 15px 20px; background: rgba(15, 23, 42, 0.9); backdrop-filter: blur(10px); border-top: 1px solid rgba(255,255,255,0.1); gap: 10px; }
        input[type="text"] { flex: 1; padding: 14px 18px; background: rgba(30, 41, 59, 0.8); border: 1px solid rgba(255,255,255,0.1); color: white; border-radius: 12px; outline: none; font-size: 1rem; transition: 0.3s; }
        input[type="text"]:focus { border-color: #a855f7; box-shadow: 0 0 10px rgba(168, 85, 247, 0.2); }
        
        button { padding: 0 22px; background: linear-gradient(135deg, #9333ea, #3b82f6); color: white; border: none; border-radius: 12px; cursor: pointer; font-weight: bold; transition: 0.3s; }
        button:hover { opacity: 0.9; transform: scale(1.02); }

        /* Admin Panel / Button */
        #report-btn { background: rgba(239, 68, 68, 0.2); border: 1px solid #ef4444; color: #f87171; font-size: 0.75rem; padding: 5px 10px; border-radius: 8px; cursor: pointer; }
        #admin-panel { padding: 10px 20px; background: #0f172a; border-top: 1px solid rgba(255,255,255,0.05); display: none; text-align: center; gap: 10px; }
        #admin-panel input { width: 200px; display: inline-block; padding: 8px; }
    </style>
</head>
<body>

    <header>
        BVACE AI
        <span id="cloud-status">Bulut: Bağlanıyor...</span>
        <button id="report-btn" onclick="openAdmin()">Admin</button>
    </header>

    <div id="chat-container">
        <div class="message bot">Selam kanka! Eski şık tasarımıma geri döndüm ve arkaya Firebase bulutunu bağladım. Artık her yerden ortak öğreniyoruz!</div>
    </div>

    <div id="admin-panel">
        <input type="password" id="admin-pass" placeholder="Admin Şifresi...">
        <button onclick="checkAdmin()">Giriş Yap</button>
    </div>

    <div id="input-container">
        <input type="text" id="user-input" placeholder="Mesaj yaz veya 'Soru | Cevap' ile öğret..." onkeypress="handleKey(event)">
        <button onclick="sendMessage()">Gönder</button>
    </div>

    <!-- Firebase SDK (Modular v10) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDPoguXj6pEv_N5pDmLW05cyM_7HZB3_k",
            authDomain: "bvace-cloud.firebaseapp.com",
            projectId: "bvace-cloud",
            storageBucket: "bvace-cloud.firebasestorage.app",
            messagingSenderId: "751232690894",
            appId: "1:751232690894:web:2b105e3ac640eecef33e9f",
            measurementId: "G-L8VTFR2QKX"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        window.bvaceDB = db;
        window.bvaceFirestore = { collection, addDoc, getDocs };
        
        loadCloudMemory();
    </script>

    <script>
        let cloudMemory = [];

        async function loadCloudMemory() {
            try {
                if (!window.bvaceDB) {
                    setTimeout(loadCloudMemory, 500);
                    return;
                }
                const querySnapshot = await window.bvaceFirestore.getDocs(window.bvaceFirestore.collection(window.bvaceDB, "memory"));
                cloudMemory = [];
                querySnapshot.forEach((doc) => {
                    cloudMemory.push(doc.data());
                });
                document.getElementById("cloud-status").innerText = "Bulut: Aktif 🚀";
            } catch (e) {
                document.getElementById("cloud-status").innerText = "Bulut: Hata!";
            }
        }

        async function sendMessage() {
            const inputField = document.getElementById("user-input");
            const text = inputField.value.trim();
            if (!text) return;

            appendMessage(text, "user");
            inputField.value = "";

            if (text.includes("|")) {
                const parts = text.split("|");
                const q = parts[0].trim().toLowerCase();
                const a = parts[1].trim();

                try {
                    await window.bvaceFirestore.addDoc(window.bvaceFirestore.collection(window.bvaceDB, "memory"), { soru: q, cevap: a });
                    cloudMemory.push({ soru: q, cevap: a });
                    appendMessage("Eyvallah kanka, bunu buluta kaydettim artık tüm cihazlar bilecek!", "bot");
                } catch (e) {
                    appendMessage("Kanka buluta kaydederken hata oluştu!", "bot");
                }
                return;
            }

            const cleanText = text.toLowerCase();
            let found = cloudMemory.find(item => cleanText.includes(item.soru));

            setTimeout(() => {
                if (found) {
                    appendMessage(found.cevap, "bot");
                } else {
                    appendMessage("Kanka bunu henüz bilmiyorum. Öğretmek için 'Soru | Cevap' yazabilirsin.", "bot");
                }
            }, 300);
        }

        function appendMessage(text, sender) {
            const container = document.getElementById("chat-container");
            const msgDiv = document.createElement("div");
            msgDiv.className = `message ${sender}`;
            msgDiv.innerText = text;
            container.appendChild(msgDiv);
            container.scrollTop = container.scrollHeight;
        }

        function handleKey(event) {
            if (event.key === "Enter") {
                sendMessage();
            }
        }

        function openAdmin() {
            const panel = document.getElementById("admin-panel");
            panel.style.display = panel.style.display === "flex" ? "none" : "flex";
        }

        function checkAdmin() {
            const pass = document.getElementById("admin-pass").value;
            if (pass === "bvaceAndKOKOKAE123") {
                alert("Admin paneli başarıyla açıldı!");
                document.getElementById("admin-panel").style.display = "none";
            } else {
                alert("Hatalı şifre kanka!");
            }
        }
    </script>
</body>
</html>
